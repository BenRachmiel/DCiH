[package]
name = "sudoku-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
uniffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1", features = ["derive"] }
uniffi = { version = "0.29", optional = true }
rand = "0.9"

[[bin]]
name = "uniffi-bindgen"
required-features = ["uniffi/cli"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench_solver"
harness = false
